# Только тесты, без сборки и релиза — запуск вручную (Actions → Tests → Run
# workflow, или `gh workflow run tests.yml -f os=windows-latest`). Нужен, чтобы
# проверить код на Windows/macOS до тега: часть тестов (подмена папки
# программы PowerShell-скриптом, core/update_install.py) выполняется только
# там. Релизная сборка (release.yml) гоняет те же тесты.
name: Tests

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'ОС (all — все три)'
        type: choice
        options: [windows-latest, macos-latest, ubuntu-latest, all]
        default: windows-latest

# Тестам нужен только checkout — токену больше ничего не даём.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'all' && fromJSON('["windows-latest","macos-latest","ubuntu-latest"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # Те же зафиксированные версии, что у релизной сборки (release.yml).
      - name: Зависимости Python
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -o faulthandler_timeout=120 -rs

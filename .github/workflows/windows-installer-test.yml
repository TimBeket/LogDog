# Проверка установщика Windows без релиза: сборка Windows, Setup, его
# автопроверка (установка / поверх / удаление) и сам Setup — артефактом,
# чтобы скачать и попробовать руками. Запуск вручную:
#   gh workflow run windows-installer-test.yml --ref <ветка>
# Дешевле полной тестовой сборки release.yml: только Windows, без macOS.
name: Windows installer test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия в установщике (например 0.0.1-setup-test)'
        required: false
        default: '0.0.1-setup-test'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Версия — из формы, но только цифры, точки, дефисы и буквы: она идёт
      # в имена файлов и командные строки.
      - name: Версия
        shell: python
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          import os, re, sys
          version = os.environ["INPUT_VERSION"].lstrip("v")
          if not re.fullmatch(r"[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?", version):
              sys.exit(f"Недопустимая версия: {version!r}")
          numbers = [p for p in version.split("-")[0].split(".") if p.isdigit()][:4]
          numeric = ".".join(numbers + ["0"] * (4 - len(numbers)))
          with open("core/version.py", "w", encoding="utf-8") as f:
              f.write(f'VERSION = "{version}"\n')
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={version}\nNUMVER={numeric}\nASSET=LogDog-{version}-windows\n")

      - name: Зависимости Python
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Генерация иконки (.ico)
        shell: python
        run: |
          from PIL import Image
          Image.open("assets/icon.png").save("assets/icon.ico", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])

      - name: Сборка (PyInstaller, LogDog.spec)
        run: pyinstaller --noconfirm --distpath dist LogDog.spec

      - name: Установщик
        shell: pwsh
        run: ./.github/scripts/build-windows-installer.ps1

      - name: Проверка установщика
        shell: pwsh
        run: ./.github/scripts/test-windows-installer.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LogDog-setup
          path: LogDog-*-windows-setup.exe
          retention-days: 7

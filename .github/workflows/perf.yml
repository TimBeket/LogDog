# Замер отзывчивости окна (tools/perf_bench.py) на Windows — не релиз и не
# тесты. Запуск: запушить ветку perf/<что угодно>, например
#   git push origin HEAD:perf/windows
# Результат — таблицы в сводке запуска (Actions → Perf → запуск → Summary):
# текущий код и, для сравнения на той же машине, версия v1.0.
# v1.0 — на 20 тыс. записей: на 100 тыс. её поиск и фильтр шли бы десятки минут.
name: Perf

on:
  push:
    branches: ['perf/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  perf:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # нужен тег v1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Зависимости Python
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Версия v1.0 рядом
        shell: bash
        run: git worktree add ../v1.0 v1.0

      - name: Машина
        shell: bash
        run: |
          {
            echo "### Машина"
            echo
            echo '```'
            python -c "import platform, os; print(platform.platform()); print(platform.processor()); print('CPU:', os.cpu_count())"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Qt — родной для Windows (как у пользователей), не offscreen.
      - name: Текущий код, 100 000 записей
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: python tools/perf_bench.py --entries 100000 --label "Текущий код, 100 000 записей"

      - name: Текущий код, 20 000 записей
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: python tools/perf_bench.py --entries 20000 --label "Текущий код, 20 000 записей"

      - name: v1.0, 20 000 записей
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: python tools/perf_bench.py --entries 20000 --code ../v1.0 --quick-find-only --label "v1.0, 20 000 записей"
